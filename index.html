<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دردشتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7c66">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#14302b;--muted:#5d7a73;--accent:#0e7c66;--accent-ink:#fff;--line:#cfdcd8;--err:#b3261e;--mine:#0e7c66;--mine-ink:#fff;--theirs:#e3ece9}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c19;--card:#172a26;--ink:#e6f2ef;--muted:#8fb0a8;--accent:#3fc6a6;--accent-ink:#06201a;--line:#2a443e;--err:#ff8a80;--mine:#3fc6a6;--mine-ink:#06201a;--theirs:#223a35}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
.screen{display:none;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px}
.screen.on{display:block}
.screen.tall.on{display:flex;flex-direction:column;height:calc(100dvh - 32px);max-height:760px;padding:0;overflow:hidden}
h1{font-size:22px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px;line-height:1.6;font-size:15px}
input{width:100%;font-size:20px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);text-align:center;direction:ltr;margin-bottom:14px}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
#otp{letter-spacing:10px;font-size:26px}
#name{direction:rtl}
button{font-family:inherit;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.screen:not(.tall) button{width:100%}
button:disabled{opacity:.5}
button.link{background:none;color:var(--muted);font-weight:500;font-size:15px;margin-top:8px}
#msg{min-height:22px;color:var(--err);font-size:14px;text-align:center}
.logo{font-size:44px;margin-bottom:8px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;margin:0;flex:1}
.bar button{padding:8px 12px;font-size:14px;background:none;color:var(--muted);border:1px solid var(--line)}
#users{flex:1;overflow-y:auto;padding:8px}
.user{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;color:var(--ink);padding:12px;border-radius:12px;font-weight:500}
.user:hover{background:var(--theirs)}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.user small{display:block;color:var(--muted);direction:ltr;text-align:right;font-weight:400}
.empty{color:var(--muted);text-align:center;padding:32px 16px;line-height:1.7}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:16px;line-height:1.5;word-break:break-word;font-size:16px}
.m.me{align-self:flex-start;background:var(--mine);color:var(--mine-ink)}
.m.them{align-self:flex-end;background:var(--theirs)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.compose input{margin:0;font-size:17px;padding:12px;text-align:right;direction:rtl;flex:1}
.compose button{padding:12px 18px}
</style>
</head>
<body>

<section class="screen on" id="s-phone">
  <div class="logo">💬</div>
  <h1>أدخل رقم هاتفك</h1>
  <p>اكتب الرقم مع رمز الدولة، مثل +967XXXXXXXXX</p>
  <input id="phone" type="tel" value="+967" inputmode="tel" autocomplete="tel">
  <button id="send">إرسال الرمز</button>
</section>

<section class="screen" id="s-otp">
  <h1>أدخل رمز التحقق</h1>
  <p id="otp-hint">أدخل الرمز المكوّن من 6 أرقام.</p>
  <input id="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  <button id="verify">تأكيد</button>
  <button class="link" id="resend" disabled>إعادة الإرسال</button>
  <button class="link" id="back">تغيير الرقم</button>
</section>

<section class="screen" id="s-profile">
  <h1>أكمل ملفك الشخصي</h1>
  <p>الاسم الذي سيراه الآخرون.</p>
  <input id="name" type="text" maxlength="40" placeholder="اسمك">
  <button id="save">حفظ ومتابعة</button>
</section>

<section class="screen tall" id="s-home">
  <div class="bar">
    <h1 id="hello">المحادثات</h1>
    <button id="refresh">تحديث</button>
    <button id="logout">خروج</button>
  </div>
  <div id="users"></div>
</section>

<section class="screen tall" id="s-chat">
  <div class="bar">
    <button id="chat-back">رجوع</button>
    <h1 id="chat-title"></h1>
  </div>
  <div id="msgs"></div>
  <div class="compose">
    <input id="text" type="text" maxlength="1000" placeholder="اكتب رسالة" autocomplete="off">
    <button id="sendmsg">إرسال</button>
  </div>
</section>

<div style="position:fixed;bottom:8px;left:16px;right:16px;pointer-events:none"><div id="msg"></div></div>
<div id="recaptcha"></div>

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, addDoc, collection, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9I0FC5WLCZnv_RjfNwHW6l_MufeeN9cw",
  authDomain: "my-chat-app-fdae4.firebaseapp.com",
  projectId: "my-chat-app-fdae4",
  storageBucket: "my-chat-app-fdae4.firebasestorage.app",
  messagingSenderId: "877999004775",
  appId: "1:877999004775:web:6dc8723456a57bd54a08c2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "ar";
const db = getFirestore(app);
const $ = id => document.getElementById(id);

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  say("");
}
function say(t){ $("msg").textContent = t; }

const errors = {
  "auth/invalid-phone-number": "رقم الهاتف غير صحيح. ابدأ بـ + ورمز الدولة.",
  "auth/invalid-verification-code": "الرمز غير صحيح.",
  "auth/code-expired": "انتهت صلاحية الرمز. أعد الإرسال.",
  "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.",
  "auth/unauthorized-domain": "هذا النطاق غير مضاف في Authorized domains في Firebase.",
  "auth/captcha-check-failed": "فشل التحقق من reCAPTCHA. حدّث الصفحة.",
  "permission-denied": "غير مسموح. تحقق من قواعد Firestore."
};
const errText = e => errors[e.code] || ("خطأ: " + (e.code || e.message));

/* ---------- تسجيل الدخول ---------- */
let confirmation = null, verifier = null, timer = null;

function startTimer(){
  let s = 60; $("resend").disabled = true;
  clearInterval(timer);
  timer = setInterval(() => {
    s--; $("resend").textContent = s > 0 ? `إعادة الإرسال بعد ${s} ث` : "إعادة الإرسال";
    if (s <= 0){ clearInterval(timer); $("resend").disabled = false; }
  }, 1000);
  $("resend").textContent = "إعادة الإرسال بعد 60 ث";
}

async function sendCode(){
  const phone = $("phone").value.replace(/\s/g, "");
  if (!/^\+\d{8,15}$/.test(phone)) return say(errors["auth/invalid-phone-number"]);
  $("send").disabled = true; say("");
  try{
    if (!verifier) verifier = new RecaptchaVerifier(auth, "recaptcha", { size: "invisible" });
    confirmation = await signInWithPhoneNumber(auth, phone, verifier);
    $("otp-hint").textContent = "أرسلنا الرمز إلى " + phone;
    $("otp").value = ""; show("s-otp"); startTimer(); $("otp").focus();
  }catch(e){
    say(errText(e));
    try{ verifier && verifier.clear(); }catch(_){}
    verifier = null;
  }
  $("send").disabled = false;
}

$("send").onclick = sendCode;
$("resend").onclick = async () => { show("s-phone"); await sendCode(); };
$("back").onclick = () => { clearInterval(timer); show("s-phone"); };

$("verify").onclick = async () => {
  const code = $("otp").value.trim();
  if (code.length !== 6) return say("أدخل الرمز المكوّن من 6 أرقام.");
  $("verify").disabled = true;
  try{ await confirmation.confirm(code); }
  catch(e){ say(errText(e)); }
  $("verify").disabled = false;
};

$("save").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return say("اكتب اسمك.");
  const u = auth.currentUser;
  $("save").disabled = true;
  try{
    await setDoc(doc(db, "users", u.uid), {
      uid: u.uid, phone: u.phoneNumber, name, createdAt: serverTimestamp()
    }, { merge: true });
    openHome(name);
  }catch(e){ say(errText(e)); }
  $("save").disabled = false;
};

$("logout").onclick = () => signOut(auth);

/* ---------- قائمة الناس ---------- */
let myName = "", unsub = null;

async function openHome(name){
  if (name) myName = name;
  $("hello").textContent = "مرحباً " + myName;
  show("s-home");
  await loadUsers();
}

async function loadUsers(){
  const box = $("users");
  box.innerHTML = '<div class="empty">جاري التحميل…</div>';
  try{
    const snap = await getDocs(collection(db, "users"));
    const others = snap.docs.map(d => d.data()).filter(u => u.uid !== auth.currentUser.uid);
    box.innerHTML = "";
    if (!others.length){
      box.innerHTML = '<div class="empty">لا يوجد مستخدمون آخرون بعد.<br>سجّل حساباً ثانياً من نافذة التصفح الخاص ثم اضغط «تحديث».</div>';
      return;
    }
    others.forEach(u => {
      const b = document.createElement("button");
      b.className = "user";
      const av = document.createElement("div");
      av.className = "av"; av.textContent = (u.name || "?").trim().charAt(0);
      const t = document.createElement("div");
      t.textContent = u.name;
      const s = document.createElement("small");
      s.textContent = u.phone || "";
      t.appendChild(s);
      b.append(av, t);
      b.onclick = () => openChat(u);
      box.appendChild(b);
    });
  }catch(e){ box.innerHTML = ""; say(errText(e)); }
}

$("refresh").onclick = loadUsers;

/* ---------- المحادثة ---------- */
let chatId = null;

function openChat(other){
  const me = auth.currentUser.uid;
  chatId = [me, other.uid].sort().join("_");
  $("chat-title").textContent = other.name;
  $("msgs").innerHTML = "";
  show("s-chat");

  const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt"));
  unsub = onSnapshot(q, snap => {
    const box = $("msgs");
    box.innerHTML = "";
    snap.forEach(d => {
      const m = d.data();
      const el = document.createElement("div");
      el.className = "m " + (m.from === me ? "me" : "them");
      el.textContent = m.text;
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }, e => say(errText(e)));
  $("text").focus();
}

async function sendMessage(){
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  try{
    await addDoc(collection(db, "chats", chatId, "messages"), {
      from: auth.currentUser.uid, text, createdAt: serverTimestamp()
    });
  }catch(e){ say(errText(e)); $("text").value = text; }
}

$("sendmsg").onclick = sendMessage;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
$("chat-back").onclick = () => { if (unsub){ unsub(); unsub = null; } openHome(); };

/* ---------- حالة الدخول ---------- */
onAuthStateChanged(auth, async user => {
  if (unsub){ unsub(); unsub = null; }
  if (!user){ show("s-phone"); return; }
  try{
    const snap = await getDoc(doc(db, "users", user.uid));
    const name = snap.exists() ? snap.data().name : "";
    name ? openHome(name) : show("s-profile");
  }catch(e){ show("s-profile"); say(errText(e)); }
});
</script>
</body>
</html>
